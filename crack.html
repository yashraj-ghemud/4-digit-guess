<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crack • CodeBreaker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="card">
    <h1>CODE<span>BREAKER</span> // Crack</h1>
    <p>Enter your name + 4-digit password. Crack it to enter leaderboard 😈</p>

    <div class="row">
      <input id="nameInput" placeholder="Your name..." maxlength="25" />
    </div>

    <div class="row">
      <input id="passInput" placeholder="4-digit password..." maxlength="4" inputmode="numeric" />
      <button id="checkBtn">Submit ↵</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="small">
      <a href="./leaderboard.html">View Leaderboard</a>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const nameInput = document.getElementById("nameInput");
    const passInput = document.getElementById("passInput");
    const checkBtn = document.getElementById("checkBtn");
    const msg = document.getElementById("msg");

    function cleanName(n){
      return (n || "")
        .trim()
        .replace(/\s+/g, " ")
        .slice(0, 25);
    }

    passInput.addEventListener("input", () => {
      passInput.value = (passInput.value || "").replace(/\D/g, "").slice(0, 4);
    });

    // auto-fill name from localstorage
    const saved = localStorage.getItem("cb_name");
    if(saved){
      nameInput.value = saved;
    }

    async function checkPassword(){
      const name = cleanName(nameInput.value);
      const pass = (passInput.value || "").trim();

      if(!name){
        msg.innerHTML = `<span class="bad">❌ Enter your name.</span>`;
        return;
      }
      if(pass.length !== 4){
        msg.innerHTML = `<span class="bad">❌ Enter exactly 4 digits.</span>`;
        passInput.value = "";
        return;
      }

      const ref = doc(db, "players", name.toLowerCase());
      const snap = await getDoc(ref);

      if(!snap.exists()){
        msg.innerHTML = `<span class="bad">❌ Name not found. Register first.</span>`;
        return;
      }

      const data = snap.data();

      // increment attempts (always)
      await updateDoc(ref, { attempts: increment(1) });

      if(data.cracked){
        msg.innerHTML = `<span class="good">✅ You already cracked it. Redirecting to leaderboard...</span>`;
        setTimeout(()=> window.location.href = "./leaderboard.html", 800);
        return;
      }

      if(pass === data.secretCode){
        await updateDoc(ref, {
          cracked: true,
          crackedAt: serverTimestamp()
        });

        msg.innerHTML = `<span class="good">✅ ACCESS GRANTED! Redirecting...</span>`;
        setTimeout(()=> window.location.href = "./leaderboard.html", 900);
      } else {
        msg.innerHTML = `<span class="bad">❌ Wrong password! Try again.</span>`;
        passInput.value = "";
        passInput.focus();
      }
    }

    checkBtn.addEventListener("click", checkPassword);

    passInput.addEventListener("keydown", (e) => {
      if(e.key === "Enter") checkPassword();
    });
  </script>
</body>
</html>
