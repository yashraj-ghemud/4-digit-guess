<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register • CodeBreaker</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Simple modal for PIN change */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center}
    .modal{background:#fff;padding:18px;border-radius:8px;max-width:360px;width:92%;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
    .modal h3{margin:0 0 8px}
    .modal .row{display:flex;gap:8px;margin-top:8px}
    .modal input{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
    .btn{cursor:pointer;padding:8px 12px;border-radius:6px;border:0;background:#111;color:#fff}
    .btn.ghost{background:#eee;color:#111}
  </style>
</head>
<body>
  <div class="card">
    <h1>CODE<span>BREAKER</span> // Register</h1>
    <p>Enter your name. System will assign you a 4-digit secret key. 🔥</p>

    <div class="row">
      <input id="nameInput" placeholder="Enter your hacker name..." maxlength="25" />
      <button id="joinBtn">Generate Key →</button>
    </div>

    <div class="msg" id="msg"></div>
    <div style="margin-top:12px">
      <button id="pinChangeBtn" class="btn ghost">Change PIN</button>
    </div>
    <div class="small">After generating key, you will be redirected to cracking page.</div>
  </div>

  <!-- PIN change modal -->
  <div id="pinModal" class="modal-overlay" role="dialog" aria-hidden="true">
    <div class="modal">
      <h3>Change PIN</h3>
      <div style="font-size:13px;color:#444">Enter target name and new 4-digit PIN</div>
      <div class="row" style="margin-top:12px">
        <input id="modalName" placeholder="Name..." maxlength="25" />
      </div>
      <div class="row" style="margin-top:8px">
        <input id="modalPin" placeholder="New 4-digit PIN" maxlength="4" />
      </div>
      <div class="actions">
        <button id="cancelPinBtn" class="btn ghost">Cancel</button>
        <button id="savePinBtn" class="btn">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const nameInput = document.getElementById("nameInput");
    const joinBtn = document.getElementById("joinBtn");
    const msg = document.getElementById("msg");

    function make4Digit(){
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function cleanName(n){
      return (n || "")
        .trim()
        .replace(/\s+/g, " ")
        .slice(0, 25);
    }

    joinBtn.addEventListener("click", async () => {
      const name = cleanName(nameInput.value);
      if(!name){
        msg.innerHTML = `<span class="bad">❌ Please enter a name.</span>`;
        return;
      }

      msg.innerHTML = `⏳ Assigning secret code...`;

      const playerRef = doc(db, "players", name.toLowerCase());

      const snap = await getDoc(playerRef);

      // If name exists, keep same code
      if(snap.exists()){
        const data = snap.data();
        localStorage.setItem("cb_name", name);
        msg.innerHTML = `<span class="good">✅ Welcome back ${name}. Your key is already assigned.</span>`;
        setTimeout(()=> window.location.href = "./crack.html", 700);
        return;
      }

      const secret = make4Digit();

      await setDoc(playerRef, {
        displayName: name,
        secretCode: secret,
        cracked: false,
        crackedAt: null,
        attempts: 0,
        createdAt: serverTimestamp()
      });

      localStorage.setItem("cb_name", name);

      msg.innerHTML = `<span class="good">✅ Assigned new secret code to ${name}. Redirecting...</span>`;
      setTimeout(()=> window.location.href = "./crack.html", 800);
    });

    // Enter key support
    nameInput.addEventListener("keydown", (e) => {
      if(e.key === "Enter") joinBtn.click();
    });

    // --- PIN change modal logic ---
    const pinChangeBtn = document.getElementById("pinChangeBtn");
    const pinModal = document.getElementById("pinModal");
    const modalName = document.getElementById("modalName");
    const modalPin = document.getElementById("modalPin");
    const savePinBtn = document.getElementById("savePinBtn");
    const cancelPinBtn = document.getElementById("cancelPinBtn");

    function openModal(){
      pinModal.style.display = "flex";
      pinModal.setAttribute('aria-hidden','false');
      modalName.value = '';
      modalPin.value = '';
      modalName.focus();
    }

    function closeModal(){
      pinModal.style.display = "none";
      pinModal.setAttribute('aria-hidden','true');
    }

    pinChangeBtn.addEventListener('click', openModal);
    cancelPinBtn.addEventListener('click', closeModal);

    // Save new PIN (no security checks by design for this game)
    savePinBtn.addEventListener('click', async () => {
      const target = cleanName(modalName.value);
      const newPin = (modalPin.value || "").trim();

      if(!target){
        alert('Please enter a name.');
        return;
      }

      if(!/^[0-9]{4}$/.test(newPin)){
        alert('PIN must be 4 digits.');
        return;
      }

      msg.innerHTML = `⏳ Updating PIN for ${target}...`;

      const playerRef = doc(db, "players", target.toLowerCase());

      // Overwrite or create the secretCode (merge so other fields remain)
      await setDoc(playerRef, {
        displayName: target,
        secretCode: newPin,
        cracked: false,
        crackedAt: null,
        attempts: 0
      }, { merge: true });

      msg.innerHTML = `<span class="good">✅ PIN updated for ${target}.</span>`;
      closeModal();
    });

    // allow Enter to submit in modal
    modalPin.addEventListener('keydown', (e) => { if(e.key === 'Enter') savePinBtn.click(); });

  </script>
</body>
</html>
